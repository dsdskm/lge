# =============================================================================
# QA 프로덕션 compose : EC2 인스턴스 1대에서 서비스별 컨테이너로 실행
#   - 이미지: ECR 의 단일 unified-service (SERVICE_NAME 으로 실행 서비스 선택)
#   - DB: 컨테이너 내 Postgres (서비스별 1개, llm_gateway 는 DB 불필요)
#   - 포트: 호스트 3001/3002/3003/3004/3005/3007/3008 → ALB Target Group 매핑
#
# 사용:
#   export IMAGE_REMOTE=398838060384.dkr.ecr.ap-northeast-2.amazonaws.com/rsp-qa-ai/unified-service:latest
#   docker compose -f deploy/compose.qa.yml pull
#   docker compose -f deploy/compose.qa.yml up -d
#
# 시크릿(Azure OpenAI 키, MAIL_* 등)은 같은 디렉터리의 .env 로 주입(있으면 로드, 없어도 기동).
# 아래 environment 의 배선값(DB_URL_*, URL_*, PORT_*)이 .env 보다 우선합니다.
# 요구: Docker Compose v2.24+ (env_file required:false 문법)
# =============================================================================

x-image: &image
  image: ${IMAGE_REMOTE:-398838060384.dkr.ecr.ap-northeast-2.amazonaws.com/rsp-qa-ai/unified-service:latest}

# 컨테이너 stdout/stderr → CloudWatch Logs (그룹은 CWAgent와 동일). 스트림은 서비스별로 지정.
# 요구: EC2 인스턴스 역할에 logs:CreateLogStream/PutLogEvents/CreateLogGroup 권한
#       (CloudWatchAgentServerPolicy 포함 시 충족)
x-awslogs-opts: &awslogs-opts
  awslogs-region: ap-northeast-2
  awslogs-group: /aws/ec2/rsp-qa-ai
  awslogs-create-group: "true"

# 모든 앱 컨테이너 공통: 시크릿용 .env(선택) + 서비스 간 호출 URL 배선
x-app-common: &app-common
  <<: *image
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &svc-urls
    NODE_ENV: production
    AWS_DEFAULT_REGION: ap-northeast-2
    CORS_ALLOWED_ORIGINS: "https://dev.hcrsp.com,https://qa.hcrsp.com,http://localhost:5173,http://127.0.0.1:5173"
    # 관리용 DB import 토큰(ADMIN_SEED_TOKEN)은 시크릿이라 .env 로 주입한다.
    # (environment 블록은 .env 보다 우선하므로 여기 두지 않는다.)
    URL_CONFIG_MANAGER: http://config_manager:3008
    URL_EVENT_RECEIVER: http://event_receiver:3001
    URL_EVENT_ANALYZER: http://event_analyzer:3002
    URL_ACTION_RUNNER: http://action_runner:3004
    URL_REPORT_MANAGER: http://report_manager:3005
    URL_LLM_GATEWAY: http://llm_gateway:3003

# Postgres 공통 템플릿
# 버전은 로컬 dev DB(scripts/db/db.sh)와 같은 메이저로 맞춘다.
# 메이저를 올리면 기존 볼륨(구 버전 데이터 디렉터리)을 그대로 못 읽으므로,
# 반드시 backup.sh 로 덤프 → 볼륨 초기화 → restore.sh 순서로 옮겨야 한다.
x-db-common: &db-common
  image: postgres:${POSTGRES_IMAGE_TAG:-18-alpine}
  restart: unless-stopped
  environment:
    POSTGRES_USER: root
    POSTGRES_PASSWORD: root

services:
  # ── Databases ──────────────────────────────────────────────
  config_manager_db:
    <<: *db-common
    # 서비스 키(= 네트워크 호스트명)는 DB_URL_* 배선 때문에 유지하고, 컨테이너 이름만 고정한다.
    # backup.sh / db-tunnel-aws.sh 가 기대하는 이름과 같게 맞춘다.
    container_name: config-manager-pg
    environment: { POSTGRES_USER: root, POSTGRES_PASSWORD: root, POSTGRES_DB: config_manager_db }
    volumes: ["config_manager_db_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d config_manager_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DB 6개가 동시에 초기화되면 첫 기동이 수십 초 걸린다. 그 사이 실패로 세지 않는다.
      start_period: 60s

  event_receiver_db:
    <<: *db-common
    # 서비스 키(= 네트워크 호스트명)는 DB_URL_* 배선 때문에 유지하고, 컨테이너 이름만 고정한다.
    # backup.sh / db-tunnel-aws.sh 가 기대하는 이름과 같게 맞춘다.
    container_name: event-receiver-pg
    environment: { POSTGRES_USER: root, POSTGRES_PASSWORD: root, POSTGRES_DB: event_receiver_db }
    volumes: ["event_receiver_db_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d event_receiver_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DB 6개가 동시에 초기화되면 첫 기동이 수십 초 걸린다. 그 사이 실패로 세지 않는다.
      start_period: 60s

  event_analyzer_db:
    <<: *db-common
    # 서비스 키(= 네트워크 호스트명)는 DB_URL_* 배선 때문에 유지하고, 컨테이너 이름만 고정한다.
    # backup.sh / db-tunnel-aws.sh 가 기대하는 이름과 같게 맞춘다.
    container_name: event-analyzer-pg
    environment: { POSTGRES_USER: root, POSTGRES_PASSWORD: root, POSTGRES_DB: event_analyzer_db }
    volumes: ["event_analyzer_db_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d event_analyzer_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DB 6개가 동시에 초기화되면 첫 기동이 수십 초 걸린다. 그 사이 실패로 세지 않는다.
      start_period: 60s

  action_runner_db:
    <<: *db-common
    # 서비스 키(= 네트워크 호스트명)는 DB_URL_* 배선 때문에 유지하고, 컨테이너 이름만 고정한다.
    # backup.sh / db-tunnel-aws.sh 가 기대하는 이름과 같게 맞춘다.
    container_name: action-runner-pg
    environment: { POSTGRES_USER: root, POSTGRES_PASSWORD: root, POSTGRES_DB: action_runner_db }
    volumes: ["action_runner_db_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d action_runner_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DB 6개가 동시에 초기화되면 첫 기동이 수십 초 걸린다. 그 사이 실패로 세지 않는다.
      start_period: 60s

  report_manager_db:
    <<: *db-common
    # 서비스 키(= 네트워크 호스트명)는 DB_URL_* 배선 때문에 유지하고, 컨테이너 이름만 고정한다.
    # backup.sh / db-tunnel-aws.sh 가 기대하는 이름과 같게 맞춘다.
    container_name: report-manager-pg
    environment: { POSTGRES_USER: root, POSTGRES_PASSWORD: root, POSTGRES_DB: report_manager_db }
    volumes: ["report_manager_db_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d report_manager_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DB 6개가 동시에 초기화되면 첫 기동이 수십 초 걸린다. 그 사이 실패로 세지 않는다.
      start_period: 60s

  ai_chat_service_db:
    <<: *db-common
    # 서비스 키(= 네트워크 호스트명)는 DB_URL_* 배선 때문에 유지하고, 컨테이너 이름만 고정한다.
    # backup.sh / db-tunnel-aws.sh 가 기대하는 이름과 같게 맞춘다.
    container_name: ai-chat-service-pg
    environment: { POSTGRES_USER: root, POSTGRES_PASSWORD: root, POSTGRES_DB: ai_chat_service_db }
    volumes: ["ai_chat_service_db_pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ai_chat_service_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      # DB 6개가 동시에 초기화되면 첫 기동이 수십 초 걸린다. 그 사이 실패로 세지 않는다.
      start_period: 60s

  # ── Services ───────────────────────────────────────────────
  config_manager:
    <<: *app-common
    container_name: config_manager
    environment:
      <<: *svc-urls
      SERVICE_NAME: config_manager
      PORT_CONFIG_MANAGER: "3008"
      DB_URL_CONFIG_MANAGER: postgres://root:root@config_manager_db:5432/config_manager_db
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-stream: config_manager
    ports: ["3008:3008"]
    depends_on:
      config_manager_db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3008/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  llm_gateway:
