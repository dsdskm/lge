    container_name: llm_gateway
    environment:
      <<: *svc-urls
      SERVICE_NAME: llm_gateway
      PORT_LLM_GATEWAY: "3003"
      # Vertex(Gemini) 인증: 키 파일은 이미지에 포함되어 있고 앱 루트 기준 상대경로로 참조한다.
      GOOGLE_CLOUD_PROJECT: ailogsystem-493123
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_APPLICATION_CREDENTIALS: src/key/ailogsystem-service-account.json
      AZURE_OPENAI_ENDPOINT: https://hs-prd-lab-robot-oai.openai.azure.com
      AZURE_OPENAI_API_KEY: 5sApBKcEN6hBBS38seWzTCNHlrVvq698A10KuQp7mkVRzty5zH0lJQQJ99CCACNns7RXJ3w3AAABACOGgTBS
      AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
      AZURE_OPENAI_DEPLOYMENT: gpt-5
      AZURE_OPENAI_MODEL: gpt-5
      AZURE_OPENAI_TIMEOUT_MS: "300000"
      AZURE_OPENAI_MAX_TOKENS: "16384"
      AZURE_ANSWER_PREVIEW_CHARS: "2000"
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-stream: llm_gateway
    ports: ["3003:3003"]
    depends_on:
      config_manager: { condition: service_started }
    # Azure OpenAI 내부 엔드포인트 (VPC 내부망에서 라우팅 가능해야 함)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
