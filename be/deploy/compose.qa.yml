volumes:
  # PG18 이미지는 /var/lib/postgresql 을 마운트하고 그 안에 메이저 버전별 디렉터리를 만든다.
  # 그래서 16 시절의 *_db_data 볼륨(= /var/lib/postgresql/data 를 직접 담고 있던 볼륨)과 호환되지 않는다.
  # 기존 볼륨은 롤백/덤프 추출용으로 남겨 두고, 18 부터는 *_db_pgdata 를 쓴다.
  config_manager_db_pgdata:
  ai_chat_service_db_pgdata:
  event_receiver_db_pgdata:
  event_analyzer_db_pgdata:
  action_runner_db_pgdata:
  report_manager_db_pgdata:
