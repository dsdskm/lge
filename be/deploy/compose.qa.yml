      retries: 5
      start_period: 30s

  event_receiver:
    <<: *app-common
    container_name: event_receiver
    environment:
      <<: *svc-urls
      SERVICE_NAME: event_receiver
      PORT_EVENT_RECEIVER: "3001"
      DB_URL_EVENT_RECEIVER: postgres://root:root@event_receiver_db:5432/event_receiver_db
      # Firebase(Firestore 트리거) — 프론트 자동 새로고침 알림용. 웹 config라 비밀 아님.
      FIREBASE_API_KEY: AIzaSyCKIrn5Ddal7jxN10vYdsneTDHuloQoV_8
      FIREBASE_AUTH_DOMAIN: ailogsystem-493123.firebaseapp.com
      FIREBASE_PROJECT_ID: ailogsystem-493123
      FIREBASE_STORAGE_BUCKET: ailogsystem-493123.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: "669089571738"
      FIREBASE_APP_ID: "1:669089571738:web:ce3a9af07ccd638d0e1023"
      FIRESTORE_DATABASE_ID: main
    logging:
      driver: awslogs
      options:
        <<: *awslogs-opts
        awslogs-stream: event_receiver
    ports: ["3001:3001"]
